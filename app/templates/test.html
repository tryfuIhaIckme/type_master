{% extends "base.html" %}

{% block content %}
<style>
    #text-display {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.6rem;
        line-height: 2.4rem;
        letter-spacing: 0.05rem;
        color: #555; /* Еще не напечатано */
        user-select: none;
        background: transparent;
        padding: 30px;
        border-radius: 15px;
        position: relative;
        min-height: 200px;
    }
    .char-correct { color: #e0e0e0; } /* Светлый для правильных */
    .char-incorrect { color: #e74c3c; background: rgba(231, 76, 60, 0.1); border-radius: 4px; } 
    .char-current { 
        border-bottom: 3px solid var(--accent);
        animation: blink 1s infinite;
    }
    
    @keyframes blink { 50% { border-color: transparent; } }
    
    #typing-input {
        position: absolute;
        opacity: 0;
        z-index: -1;
    }

    .stat-box {
        background: #1a1a1a;
        padding: 15px 25px;
        border-radius: 15px;
        border: 1px solid var(--border);
        text-align: center;
    }

    .stat-value {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--accent);
        display: block;
    }

    .stat-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
    }
</style>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-11">
            <div class="card p-5 border-0 shadow-lg">
                <h2 class="text-center mb-5 opacity-75">{{ text.title }}</h2>
                
                <!-- Статистика -->
                <div class="d-flex justify-content-between mb-5">
                    <div class="stat-box">
                        <span class="stat-label">WPM</span>
                        <span class="stat-value" id="wpm">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Accuracy</span>
                        <span class="stat-value"><span id="accuracy">100</span>%</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Errors</span>
                        <span class="stat-value" id="errors">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Time</span>
                        <span class="stat-value"><span id="timer">0</span>s</span>
                    </div>
                </div>

                <!-- Контейнер с текстом -->
                <div id="text-display" onclick="focusInput()">
                    <!-- Сюда JS вставит символы -->
                </div>

                <!-- Скрытое поле ввода -->
                <input type="text" id="typing-input" autocomplete="off">
                
                <div class="text-center mt-5">
                    <p class="text-muted small">Начните печатать, чтобы запустить таймер. <br> <span class="badge border border-secondary mt-2">Tab для перезапуска (скоро)</span></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const originalText = {{ text.content | tojson }}.trim().replace(/\s+/g, ' ');
const textId = {{ text.id | tojson if text.id is defined else 'null' }};
const mode = {{ text.mode | default('text') | tojson }};
const language = {{ text.language | default('ru') | tojson }};
const difficulty = {{ text.difficulty | default('medium') | tojson }};

let startTime, timerInterval;
let errorsCount = 0;
let isFinished = false;

const display = document.getElementById('text-display');
const inputField = document.getElementById('typing-input');
const wpmDisplay = document.getElementById('wpm');
const accDisplay = document.getElementById('accuracy');
const errDisplay = document.getElementById('errors');
const timerDisplay = document.getElementById('timer');

// Инициализация текста (разбиваем на спаны по символам)
function initText() {
    display.innerHTML = originalText.split('').map((char, index) => {
        return `<span id="char-${index}">${char}</span>`;
    }).join('');
    document.getElementById('char-0').classList.add('char-current');
}

// Фокус на поле ввода при клике по области
function focusInput() {
    inputField.focus();
}

inputField.addEventListener('input', () => {
    if (isFinished) return;

    if (!startTime) {
        startTime = new Date();
        startTimer();
    }

    const typedText = inputField.value;
    const currentIndex = typedText.length - 1;

    // Считаем ошибки и подсвечиваем символы
    errorsCount = 0;
    for (let i = 0; i < originalText.length; i++) {
        const charElement = document.getElementById(`char-${i}`);
        charElement.classList.remove('char-correct', 'char-incorrect', 'char-current');

        if (i < typedText.length) {
            if (typedText[i] === originalText[i]) {
                charElement.classList.add('char-correct');
            } else {
                charElement.classList.add('char-incorrect');
                errorsCount++;
            }
        } else if (i === typedText.length) {
            charElement.classList.add('char-current');
        }
    }

    // Обновляем статистику в реальном времени
    updateStats(typedText.length);

    // Если напечатали всё
    if (typedText.length >= originalText.length) {
        finishTest();
    }
});

function startTimer() {
    timerInterval = setInterval(() => {
        const now = new Date();
        const diff = Math.floor((now - startTime) / 1000);
        timerDisplay.innerText = diff;
        updateStats(inputField.value.length);
    }, 1000);
}

function updateStats(charCount) {
    if (!startTime) return;
    const now = new Date();
    const minutes = (now - startTime) / 60000;
    
    // Формула WPM: (символы / 5) / минуты
    const wpm = Math.round((charCount / 5) / minutes) || 0;
    const accuracy = Math.round(((charCount - errorsCount) / charCount) * 100) || 100;

    wpmDisplay.innerText = wpm;
    accDisplay.innerText = accuracy;
    errDisplay.innerText = errorsCount;
}

function finishTest() {
    isFinished = true;
    clearInterval(timerInterval);
    const wpm = parseInt(wpmDisplay.innerText);
    const accuracy = parseInt(accDisplay.innerText);

    // Отправляем данные на сервер через API
    fetch('/save_result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            text_id: textId,
            wpm: wpm,
            accuracy: accuracy,
            errors: errorsCount,
            mode: mode,
            language: language,
            difficulty: difficulty
        })
    })
    .then(response => response.json())
    .then(data => {
        alert(`Тест завершен! \nСкорость: ${wpm} WPM \nТочность: ${accuracy}%`);
        window.location.href = "{{ url_for('profile') }}";
    })
    .catch(err => console.error('Ошибка сохранения:', err));
}

window.onload = initText;
</script>
{% endblock %}
